name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        java-version: [17, 21, 25]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: liberica
        java-package: jdk+fx # optional (jdk, jre, jdk+fx or jre+fx) - defaults to jdk
        cache: maven
    - name: Build with Maven
      # JavaFX tests need a display; xvfb is preinstalled on ubuntu runners
      run: xvfb-run -a mvn -B test --file pom.xml
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-jdk${{ matrix.java-version }}
        path: '**/target/surefire-reports/**'
    - name: Upload coverage report
      if: matrix.java-version == 17
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: '**/target/site/jacoco/**'
